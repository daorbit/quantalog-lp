<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240">
  <style>
    .leg { transform-box: view-box; animation: gallop 0.5s ease-in-out infinite alternate; }
    .back { animation-delay: -0.5s; }
    .deer { animation: bound 0.5s ease-in-out infinite alternate; }
    .lead { animation-delay: -0.25s; }
    .nose { animation: glow 0.9s ease-in-out infinite alternate; }
    .front { transform-origin: 100px 88px; }
    .hind { transform-origin: 40px 90px; }
    @keyframes gallop { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
    @keyframes bound { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    @keyframes glow { from { opacity: 0.55; } to { opacity: 1; } }
  </style>
