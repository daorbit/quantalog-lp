<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 130" width="184" height="130">
  <style>
    .arm { transform-origin: 122px 112px; animation: wave 0.8s ease-in-out infinite alternate; }
    .eyes { transform-origin: 80px 52px; animation: blink 4s linear infinite; }
    .pom { transform-origin: 106px 30px; animation: sway 1.6s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(14deg); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .arm, .eyes, .pom { animation: none; } }
  </style>
